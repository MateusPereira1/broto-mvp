<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entre na sua conta Broto.">
    <title>Broto - Login</title>
    <link rel="icon" type="image/png" sizes="64x64" href="./images/favicon.png">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <main id="pagina-login">
        <section id="lado-esquerdo" aria-label="Boas-vindas ao Broto">
            <div id="apresentacao">
                <div id="logo-broto">
                    <img src="./images/Logo broto.svg" alt="">
                    <span>broto</span>
                </div>
                <h2 id="boas-vindas">Bem-vindo!</h2>
            </div>
        </section>

        <section id="lado-direito" aria-labelledby="titulo-login">
            <div id="cartao-login">
                <header class="login-cabecalho">
                    <img src="./images/Logo broto.svg" alt="">
                    <h1 id="titulo-login">LOGIN</h1>
                </header>
                <p id="subtitulo-login">Que bom te ver aqui!</p>

                <form id="form-login" novalidate>
                
                    <label class="sr-only" for="email">Email</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="Email"
                        autocomplete="email"
                    >

                    <label class="sr-only" for="senha">Senha</label>
                    <input
                        id="senha"
                        name="senha"
                        type="password"
                        placeholder="Senha"
                        autocomplete="current-password"
                    >

                    <fieldset class="login-perfil">
                        <legend class="sr-only">Entrar como</legend>
                        <label>
                            <input type="radio" name="perfil" value="comprador" checked>
                            <span>COMPRADOR</span>
                        </label>
                        <label>
                            <input type="radio" name="perfil" value="vendedor">
                            <span>VENDEDOR</span>
                        </label>
                    </fieldset>

                    <a class="login-cadastro" href="./view/registro.html">NÃO TENHO CONTA CRIADA</a>
                    <button id="botao-entrar" type="submit">ENTRAR</button>
                    <p id="mensagem-login" role="status" aria-live="polite"></p>
                </form>
            </div>
        </section>
    </main>

    <script type="module" src="./controller/loginController.js"></script>
</body>
</html>
