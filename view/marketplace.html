<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Encontre produtos frescos de produtores locais no Broto.">
    <title>Broto - Marketplace</title>
    <link rel="icon" type="image/png" sizes="64x64" href="../images/favicon.png">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/marketplace.css">
    <link rel="stylesheet" href="../css/footer.css">
    <script src="../controller/header.js" defer></script>
    <script type="module" src="../controller/carrinho.js"></script>
    <script type="module" src="../controller/marketplace.js" defer></script>
</head>
<body>
    <broto-header></broto-header>

    <main class="marketplace">
        <div class="marketplace__filters">
            <form class="marketplace__search" role="search">
                <label class="sr-only" for="busca-produtos">Buscar por produto, produtor ou localização</label>
                <svg class="marketplace__search-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none">
                    <circle cx="10.8" cy="10.8" r="7.2" stroke="currentColor" stroke-width="1.7"></circle>
                    <path d="m16.2 16.2 5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
                </svg>
                <input id="busca-produtos" type="search" placeholder="Buscar produto, produtor ou localização" autocomplete="off">
            </form>
            <div class="marketplace__actions">
                <label class="marketplace__action marketplace__excess-filter">
                    <input id="filtro-excedentes" type="checkbox">
                    Só excedentes
                </label>
            </div>
        </div>

        <section class="products" aria-label="Produtos disponíveis"></section>

        <template id="product-card-template">
            <article class="product-card">
                <a class="product-card__image-link">
                    <img class="product-card__image" alt="">
                </a>
                <button class="product-card__favorite" type="button" aria-pressed="false">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
                        <path d="M20.8 8.8c0 4.1-8.8 10-8.8 10S3.2 12.9 3.2 8.8a4.5 4.5 0 0 1 8.8-1.3 4.5 4.5 0 0 1 8.8 1.3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                </button>
                <div class="product-card__details">
                    <h2 class="product-card__name"></h2>
                    <span class="product-excess-badge" hidden><span aria-hidden="true">🌱</span> Excedente</span>
                    <p class="product-card__location"></p>
                    <p class="product-card__price"></p>
                    <a class="product-card__buy">Comprar</a>
                </div>
            </article>
        </template>

        <p class="marketplace__empty" hidden>Nenhum produto encontrado.</p>
        <p id="marketplace-status" role="status"></p>
    </main>

    <footer class="footer">
        <div class="footer__conteudo">
            <div class="footer__marca">
                <a class="footer__logo" href="./marketplace.html" aria-label="Broto - Marketplace">
                    <img src="../images/Logo broto.svg" alt="">
                    <span>broto</span>
                </a>
                <p>Produtos locais, direto de quem produz.</p>
            </div>

            <nav class="footer__navegacao" aria-label="Links úteis">
                <section class="footer__grupo" aria-labelledby="footer-explorar">
                    <h2 id="footer-explorar">Explorar</h2>
                    <ul>
                        <li><a href="./marketplace.html">Marketplace</a></li>
                        <li><a href="./mapa-produtores.html">Mapa de produtores</a></li>
                        <li><a href="./sobre-a-solucao.html">Sobre a solução</a></li>
                    </ul>
                </section>

                <section class="footer__grupo" aria-labelledby="footer-compras">
                    <h2 id="footer-compras">Compras</h2>
                    <ul>
                        <li><a href="./meus-pedidos.html">Meus pedidos</a></li>
                        <li><a href="./acompanhar-pedido.html">Acompanhar pedido</a></li>
                        <li><a href="./chat.html">Conversas</a></li>
                    </ul>
                </section>

                <section class="footer__grupo" aria-labelledby="footer-produtores">
                    <h2 id="footer-produtores">Produtores</h2>
                    <ul>
                        <li><a href="./dashboard-produtor.html">Painel do produtor</a></li>
                        <li><a href="./meus-produtos.html">Meus produtos</a></li>
                    </ul>
                </section>
            </nav>
        </div>

        <div class="footer__rodape">
            <p>&copy; <span id="footer-ano"></span> Broto</p>
        </div>
    </footer>

    <script src="../controller/footer.js"></script>

</body>
</html>
