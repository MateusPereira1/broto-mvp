<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Encontre produtos frescos de produtores locais no Broto.">
    <title>Broto - Marketplace</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/marketplace.css">
    <script src="../controller/header.js" defer></script>
    <script src="../controller/carrinho.js" defer></script>
    <script type="module" src="../controller/marketplace.js" defer></script>
</head>
<body>
    <broto-header></broto-header>

    <main class="marketplace">
        <form class="marketplace__search" role="search">
            <label class="sr-only" for="busca-produtos">Buscar produto ou produtor</label>
            <svg class="marketplace__search-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none">
                <circle cx="10.8" cy="10.8" r="7.2" stroke="currentColor" stroke-width="1.7"></circle>
                <path d="m16.2 16.2 5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
            </svg>
            <input id="busca-produtos" type="search" placeholder="Buscar produto " autocomplete="off">
        </form>

        <section class="products" aria-label="Produtos disponíveis">
            <article class="product-card" data-search="melancia cidade do produtor">
                <a class="product-card__image-link" href="./produto.html" aria-label="Ver detalhes de melancia">
                    <img
                        class="product-card__image"
                        src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=85"
                        alt="Paisagem de lago cercado por árvores"
                    >
                </a>
                <button class="product-card__favorite" type="button" aria-label="Adicionar melancia aos favoritos" aria-pressed="false">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
                        <path d="M20.8 8.8c0 4.1-8.8 10-8.8 10S3.2 12.9 3.2 8.8a4.5 4.5 0 0 1 8.8-1.3 4.5 4.5 0 0 1 8.8 1.3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                </button>
                <div class="product-card__details">
                    <h2 class="product-card__name">melancia</h2>
                    <p class="product-card__location">Cidade do Produtor</p>
                    <p class="product-card__price">R$ 100,00/Kg</p>
                    <a class="product-card__buy" href="./produto.html">Comprar</a>
                </div>
            </article>

            <article class="product-card" data-search="nome do produto cidade do produtor">
                <a class="product-card__image-link" href="./produto.html" aria-label="Ver detalhes de Nome do Produto">
                    <img
                        class="product-card__image"
                        src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=85"
                        alt="Paisagem de lago cercado por árvores"
                    >
                </a>
                <button class="product-card__favorite" type="button" aria-label="Adicionar Nome do Produto aos favoritos" aria-pressed="false">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
                        <path d="M20.8 8.8c0 4.1-8.8 10-8.8 10S3.2 12.9 3.2 8.8a4.5 4.5 0 0 1 8.8-1.3 4.5 4.5 0 0 1 8.8 1.3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                </button>
                <div class="product-card__details">
                    <h2 class="product-card__name">Nome do Produto</h2>
                    <p class="product-card__location">Cidade do Produtor</p>
                    <p class="product-card__price">R$ 100,00/Kg</p>
                    <a class="product-card__buy" href="./produto.html">Comprar</a>
                </div>
            </article>

            <article class="product-card" data-search="nome do produto cidade do produtor">
                <a class="product-card__image-link" href="./produto.html" aria-label="Ver detalhes de Nome do Produto">
                    <img
                        class="product-card__image"
                        src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=85"
                        alt="Paisagem de lago cercado por árvores"
                    >
                </a>
                <button class="product-card__favorite" type="button" aria-label="Adicionar Nome do Produto aos favoritos" aria-pressed="false">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
                        <path d="M20.8 8.8c0 4.1-8.8 10-8.8 10S3.2 12.9 3.2 8.8a4.5 4.5 0 0 1 8.8-1.3 4.5 4.5 0 0 1 8.8 1.3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                </button>
                <div class="product-card__details">
                    <h2 class="product-card__name">Nome do Produto</h2>
                    <p class="product-card__location">Cidade do Produtor</p>
                    <p class="product-card__price">R$ 100,00/Kg</p>
                    <a class="product-card__buy" href="./produto.html">Comprar</a>
                </div>
            </article>
        </section>

        <p class="marketplace__empty" hidden>Nenhum produto encontrado.</p>
    </main>
</body>
</html>
