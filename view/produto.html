<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Confira os detalhes e compre produtos de produtores locais.">
    <title>Broto - Detalhes do produto</title>
    <link rel="icon" type="image/png" sizes="64x64" href="../images/favicon.png">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/marketplace.css">
    <link rel="stylesheet" href="../css/produto.css">
    <script src="../controller/header.js" defer></script>
    <script type="module" src="../controller/carrinho.js"></script>
    <script type="module" src="../controller/produto.js"></script>
</head>
<body>
    <broto-header></broto-header>

    <main class="product-page">
        <p id="product-message" role="status">Carregando produto…</p>
        <a id="product-back" href="./marketplace.html" hidden>Voltar ao marketplace</a>

        <section class="product-detail" aria-labelledby="product-name" hidden>
            <div class="product-gallery">
                <img class="product-gallery__main" id="product-main-image" alt="">
            </div>

            <div class="product-detail__info">
                <h1 id="product-name"></h1>
                <span class="product-excess-badge" hidden><span aria-hidden="true">🌱</span> Excedente</span>
                <p class="product-detail__producer" hidden>Produtor: <span></span></p>
                <p class="product-detail__location"></p>
                <p class="product-detail__price"></p>
                <p class="product-detail__unit-price"></p>
                <p class="product-detail__stock"></p>
                <div class="product-detail__description">
                    <h2>Descrição</h2>
                    <p></p>
                </div>
                <div class="product-detail__actions">
                    <button class="product-detail__add" type="button">Adicionar ao carrinho</button>
                    <button class="product-detail__buy" type="button" data-go-to-checkout="true">Comprar</button>
                </div>
                <p id="product-cart-message" role="status"></p>
            </div>
        </section>

        <section class="related-products" aria-labelledby="related-products-title" hidden>
            <h2 id="related-products-title">Mais produtos</h2>
            <div class="products"></div>
            <template id="related-product-card">
                <article class="product-card">
                    <a class="product-card__image-link">
                        <img class="product-card__image" alt="">
                    </a>
                    <button class="product-card__favorite" type="button" aria-pressed="false">
                        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M20.8 8.8c0 4.1-8.8 10-8.8 10S3.2 12.9 3.2 8.8a4.5 4.5 0 0 1 8.8-1.3 4.5 4.5 0 0 1 8.8 1.3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                    </button>
                    <div class="product-card__details">
                        <h3 class="product-card__name"></h3>
                        <span class="product-excess-badge" hidden><span aria-hidden="true">🌱</span> Excedente</span>
                        <p class="product-card__location"></p>
                        <p class="product-card__price"></p>
                        <a class="product-card__buy">Comprar</a>
                    </div>
                </article>
            </template>
        </section>
    </main>
</body>
</html>
