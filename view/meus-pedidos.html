<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broto - Meus pedidos</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/produtor.css">
    <link rel="stylesheet" href="../css/pedido.css">
    <script src="../controller/header.js" defer></script>
    <script type="module" src="../controller/carrinho.js"></script>
    <script type="module" src="../controller/meusPedidos.js"></script>
</head>
<body>
    <broto-header></broto-header>

    <main class="area-produtor">
        <a class="produtos-voltar" href="./marketplace.html"><span class="produtos-voltar__seta" aria-hidden="true">←</span> Voltar ao marketplace</a>
        <h1>Meus pedidos</h1>
        <p class="produtos-descricao">Compras salvas neste navegador.</p>
        <p id="historico-mensagem" class="pedidos-mensagem" role="status"></p>
        <div id="historico-vazio" class="acompanhamento-card historico-vazio" hidden>
            <span class="pedido-resumo__icone" aria-hidden="true"><img src="../images/cart.svg" alt=""></span>
            <h2>Você ainda não tem pedidos</h2>
            <p>Suas compras aparecerão aqui depois de finalizadas.</p>
            <div class="pedido-acoes">
                <a href="./marketplace.html">Explorar o marketplace</a>
            </div>
        </div>
        <div id="historico-pedidos" class="historico-pedidos"></div>
        <template id="historico-pedido">
            <article class="pedido-resumo historico-pedido">
                <div class="pedido-resumo__dados">
                    <span class="pedido-resumo__icone" aria-hidden="true"><img src="../images/cart.svg" alt=""></span>
                    <div>
                        <h2></h2>
                        <p class="historico-pedido-data"></p>
                    </div>
                </div>
                <div class="pedido-resumo__total">
                    <span>Total do pedido</span>
                    <strong class="historico-pedido-total"></strong>
                </div>
                <div class="historico-pedido-rodape">
                    <p class="pedido-recebido-status">Consultando status…</p>
                    <div class="pedido-acoes">
                        <a>Acompanhar pedido <span aria-hidden="true">→</span></a>
                    </div>
                </div>
            </article>
        </template>
    </main>
</body>
</html>
