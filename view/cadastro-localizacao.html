<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Informe a localização do seu negócio no Broto.">
    <title>Broto - Cadastro de Localização</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="./cadastro.css">
    <script type="module" src="../controller/cadastroController.js"></script>
</head>
<body>
    <main class="cadastro-page">
        <section class="cadastro-lateral" aria-label="Registro de localização no Broto">
            <div class="cadastro-apresentacao">
                <div class="cadastro-logo">
                    <img src="../images/Logo broto.svg" alt="">
                    <span>broto</span>
                </div>
                <h2 class="cadastro-slogan">
                    <span>REGISTRO</span>
                    <small>LOCALIZAÇÃO</small>
                </h2>
            </div>
        </section>

        <section class="cadastro-conteudo" aria-labelledby="titulo-localizacao">
            <div class="cadastro-card cadastro-card--localizacao">
                <header class="cadastro-cabecalho">
                    <img src="../images/Logo broto.svg" alt="">
                    <h1 id="titulo-localizacao">REGISTRO</h1>
                </header>
                <p class="cadastro-subtitulo">Onde seu negócio se localiza?</p>

                <div class="localizacao-opcoes">
                    <button class="cadastro-botao" id="compartilhar-local" type="button">COMPARTILHAR LOCAL</button>
                    <p id="mensagem-local" class="cadastro-mensagem" role="status" aria-live="polite"></p>
                    <a class="cadastro-link" href="./cadastro-localizacao-manual.html">ou preencher manualmente</a>

                    <label class="foto-label" for="foto-residencia">Foto da residência</label>
                    <label class="foto-seletor" for="foto-residencia">
                        <svg aria-hidden="true" viewBox="0 0 48 48" fill="none">
                            <rect x="5" y="8" width="31" height="27" rx="3" fill="white"></rect>
                            <circle cx="27" cy="15" r="3" fill="#D1F5E9"></circle>
                            <path d="m8 30 9-9 10 10" stroke="#D1F5E9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
                            <circle cx="36" cy="34" r="10" fill="white"></circle>
                            <path d="M36 29v10M31 34h10" stroke="#0ACF83" stroke-width="2.5" stroke-linecap="round"></path>
                        </svg>
                        <span id="nome-foto">Adicionar foto</span>
                    </label>
                    <input class="sr-only" id="foto-residencia" name="foto" type="file" accept="image/*">

                    <button class="cadastro-botao" id="finalizar-localizacao" type="button">PRÓXIMO</button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
