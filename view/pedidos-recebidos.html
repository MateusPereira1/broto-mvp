<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broto - Pedidos recebidos</title>
    <link rel="icon" type="image/png" sizes="64x64" href="../images/favicon.png">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/produtor.css">
    <link rel="stylesheet" href="../css/pedido.css">
    <script src="../controller/header.js" defer></script>
    <script type="module" src="../controller/carrinho.js"></script>
    <script type="module" src="../controller/pedidosRecebidos.js"></script>
</head>
<body>
    <broto-header></broto-header>

    <main class="area-produtor">
        <a class="produtos-voltar" href="./dashboard-produtor.html"><span class="produtos-voltar__seta" aria-hidden="true">←</span> Voltar ao painel do vendedor</a>
        <h1>Pedidos recebidos</h1>
        <p class="produtos-descricao">Confira os itens de cada pedido e atualize o status para o comprador.</p>

        <section class="produtos-painel" aria-label="Pedidos do vendedor">
            <p id="pedidos-mensagem" class="acompanhamento-card pedidos-mensagem" role="status">Carregando pedidos…</p>
            <div id="pedidos-recebidos" class="pedidos-recebidos"></div>
        </section>

        <template id="pedido-recebido">
            <article class="acompanhamento-card">
                <h2></h2>
                <ul></ul>
                <div class="pedido-recebido-acoes">
                    <p class="pedido-recebido-status" role="status"></p>
                    <button type="button"></button>
                </div>
            </article>
        </template>
    </main>
</body>
</html>
