<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Encontre produtores locais no mapa do Broto.">
    <title>Broto - Mapa de Produtores</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="../css/mapa.css">
    <script src="../controller/header.js" defer></script>
    <script src="../controller/carrinho.js" defer></script>
</head>
<body>
    <broto-header></broto-header>

    <main class="map-page">
        <h1 class="sr-only">Mapa de produtores</h1>
        <section class="map-page__content" aria-label="Mapa de produtores locais">
            <div class="map-page__map">
                <div id="map"></div>
                <article class="producer-card" id="producer-card" aria-live="polite">
                    <div class="producer-card__image-wrapper">
                        <img id="producer-img" src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=500&q=80" alt="Propriedade do produtor">
                        <button class="producer-card__favorite" id="fav-btn" type="button" aria-label="Adicionar produtor aos favoritos" aria-pressed="false">
                            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
                                <path d="M20.8 8.8c0 4.1-8.8 10-8.8 10S3.2 12.9 3.2 8.8a4.5 4.5 0 0 1 8.8-1.3 4.5 4.5 0 0 1 8.8 1.3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="producer-card__body">
                        <h2 id="producer-name">Nome do Produtor</h2>
                        <p id="producer-city">Cidade do Produtor</p>
                        <button class="producer-card__products" id="btn-products" type="button">Ver produtos</button>
                    </div>
                </article>
            </div>
            <a class="map-page__back" href="./marketplace.html">Voltar</a>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../controller/mapa.js"></script>
</body>
</html>
