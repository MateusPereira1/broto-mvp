<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broto - Cadastrar produto</title>
    <link rel="icon" type="image/png" sizes="64x64" href="../images/favicon.png">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/produtor.css">
    <script src="../controller/header.js" defer></script>
    <script type="module" src="../controller/carrinho.js"></script>
    <script type="module" src="../controller/cadastrarProduto.js"></script>
</head>
<body>
    <broto-header></broto-header>

    <main class="area-produtor">
        <h1>Cadastrar produto</h1>
        <p class="produtos-descricao">Adicione um produto ao seu catálogo.</p>

        <form id="cadastro-produto" class="cadastro-produto" enctype="multipart/form-data">
            <div class="cadastro-produto__inicio">
                <div class="cadastro-produto__imagens">
                    <label class="cadastro-produto__foto">
                        <span class="cadastro-produto__foto-icone" aria-hidden="true">▧</span>
                        <img id="foto-previa" alt="Prévia da imagem do produto" hidden>
                        <strong>Adicionar imagem do produto</strong>
                        <small>JPG, PNG ou WEBP, até 32 MB.</small>
                        <input class="sr-only" type="file" id="foto-produto" name="imagem1" accept="image/jpeg,image/png,image/webp">
                    </label>
                </div>
                <div class="cadastro-produto__identidade">
                    <label>Nome do produto *
                        <input name="nome" placeholder="Ex.: Banana, alface, tomate" required>
                    </label>
                    <fieldset>
                        <legend>Tipo *</legend>
                        <div class="cadastro-produto__opcoes">
                            <label><input type="radio" name="categoria" value="Fruta" checked> Fruta</label>
                            <label><input type="radio" name="categoria" value="Verdura"> Verdura</label>
                            <label><input type="radio" name="categoria" value="Legume"> Legume</label>
                        </div>
                    </fieldset>
                </div>
            </div>

            <label>Descrição
                <textarea name="descricao" rows="3" placeholder="Ex.: Produto fresco, cultivado sem agrotóxicos."></textarea>
            </label>

            <label>Nome do produtor *
                <input name="produtor" placeholder="Ex.: Sítio Boa Vista" required>
            </label>

            <label>Localização *
                <input name="local" placeholder="Ex.: Recife, PE" required>
            </label>

            <div class="cadastro-produto__venda">
                <label>Preço (R$) *
                    <input name="preco" type="text" inputmode="decimal" placeholder="Ex.: R$ 4,50" required>
                </label>
                <label>Quantidade disponível *
                    <input name="estoque" type="text" inputmode="decimal" pattern="-?[0-9]+([.][0-9]+)?" placeholder="Ex.: 20" required>
                </label>
                <label>Unidade de venda *
                    <select name="unidade" required>
                        <option value="">Selecione</option>
                        <option value="kg">Quilograma (kg)</option>
                        <option value="un">Unidade (un)</option>
                    </select>
                </label>
            </div>

            <fieldset class="cadastro-produto__excedente">
                <legend>Produto excedente</legend>
                <div class="cadastro-produto__opcoes">
                    <label><input type="radio" name="excedente" value="sim"> Sim</label>
                    <label><input type="radio" name="excedente" value="nao" checked> Não</label>
                </div>
            </fieldset>

            <p id="cadastro-produto-erro" role="alert" hidden></p>
            <p id="cadastro-produto-status" role="status"></p>
            <div class="cadastro-produto__acoes">
                <a id="link-cancelar" href="./meus-produtos.html">Cancelar</a>
                <button type="submit">Cadastrar produto</button>
            </div>
        </form>

        <dialog id="cadastro-produto-sucesso" aria-labelledby="cadastro-produto-sucesso-titulo">
            <h2 id="cadastro-produto-sucesso-titulo">Produto cadastrado!</h2>
            <p>Seu produto foi publicado com sucesso.</p>
            <div class="cadastro-produto-sucesso__acoes">
                <button type="button" id="cadastro-produto-continuar">Cadastrar outro produto</button>
                <a href="./meus-produtos.html">Ver meus produtos</a>
            </div>
        </dialog>
    </main>
</body>
</html>
